<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Derasar Boli</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="temple.png" />
  <meta name="theme-color" content="#7B3F00" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="login-screen" class="screen active">
      <div class="login-box">
        <div class="logo-area">
          <img src="temple.png" alt="Shankheshwar Parshwanath" style="width:100px;height:70px;object-fit:cover;border-radius:8px;margin-bottom:8px;" />
          <h1>Derasar Boli</h1>
          <p class="subtitle">🙏 શ્રી શંખેશ્વર પાર્શ્વનાથાય નમઃ 🙏</p>
          <p class="subtitle">Temple Donation Management</p>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" />
        </div>
        <button class="btn-primary" onclick="login()">Login</button>
        <div id="login-error" class="error-msg"></div>
        <div style="text-align:center;margin-top:10px;">
          <a href="#" onclick="showForgotPassword()" style="color:var(--primary);font-size:12px;font-weight:600;">Forgot Password?</a>
        </div>

        <div style="text-align:center;margin-top:16px;">
          <a href="signup.html" style="color:var(--primary);font-weight:600;font-size:13px;">New Sangh? Register here →</a>
        </div>
      </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div id="forgotModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:380px;">
        <div style="font-size:16px;font-weight:800;color:#7B3000;margin-bottom:14px;">🔐 Reset Password</div>
        <div style="font-size:13px;color:#666;margin-bottom:12px;">Enter your registered email. We'll send a reset link.</div>
        <input type="email" id="forgotEmail" placeholder="Your email" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:12px;"/>
        <div id="forgotMsg" style="font-size:12px;color:#2E7D32;margin-bottom:10px;display:none;"></div>
        <div style="display:flex;gap:8px;">
          <button onclick="sendForgotPassword()" style="flex:1;background:#7B3000;color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;">Send Reset Link</button>
          <button onclick="hideForgotPassword()" style="background:#f5f5f5;border:1px solid #ddd;border-radius:10px;padding:11px 16px;font-size:13px;cursor:pointer;">Cancel</button>
        </div>
      </div>
    </div>

    <!-- NEW PASSWORD MODAL -->
    <div id="newPassModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:380px;">
        <div style="font-size:16px;font-weight:800;color:#7B3000;margin-bottom:14px;">🔐 Set New Password</div>
        <input type="password" id="newPassInput" placeholder="New password (min 6 chars)" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:10px;"/>
        <input type="password" id="newPassConfirm" placeholder="Confirm new password" style="width:100%;padding:10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:12px;"/>
        <div id="newPassMsg" style="font-size:12px;color:#D32F2F;margin-bottom:10px;display:none;"></div>
        <button onclick="confirmNewPassword()" style="width:100%;background:#7B3000;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;">Update Password</button>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-screen" class="screen" style="display:none;">

      <!-- Temple Banner -->
      <div class="temple-banner">
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
          <img src="temple.png" alt="Temple" style="width:48px;height:36px;object-fit:cover;border-radius:4px;border:2px solid var(--primary);" />
          <div>
            <div class="gujarati-text">Loading...</div>
            <div class="sangh-name">Loading...</div>
          </div>
          <img src="temple.png" alt="Temple" style="width:48px;height:36px;object-fit:cover;border-radius:4px;border:2px solid var(--primary);" />
        </div>
      </div>

      <!-- Top Bar -->
      <div class="topbar">
        <div class="topbar-left">
          <span class="app-title">🛕 Derasar Boli</span>
        </div>
        <div class="topbar-right">
          <span id="user-role-badge" class="role-badge"></span>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Nav Tabs -->
      <div class="nav-tabs" id="nav-tabs"></div>

      <!-- Page Content -->
      <div id="page-content" class="page-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/members.js"></script>
  <script src="js/donors.js"></script>
  <script src="js/events.js"></script>
  <script src="js/heads.js"></script>
  <script src="js/donations.js"></script>
  <script src="js/reports-page.js"></script>
<script src="js/reports.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/users.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
     navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
