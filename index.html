<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Derasar Boli</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="temple.png" />
  <meta name="theme-color" content="#7B3F00" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="login-screen" class="screen active">
      <div class="login-box">
        <div class="logo-area">
          <img src="temple.png" alt="Shankheshwar Parshwanath" style="width:100px;height:70px;object-fit:cover;border-radius:8px;margin-bottom:8px;" />
          <h1>Derasar Boli</h1>
          <p class="subtitle">🙏 શ્રી શંખેશ્વર પાર્શ્વનાથય નમઃ 🙏</p>
          <p class="subtitle">S K Shah Gotri Sangh, Harinagar</p>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" />
        </div>
        <button class="btn-primary" onclick="login()">Login</button>
        <div id="login-error" class="error-msg"></div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-screen" class="screen" style="display:none;">

      <!-- Temple Banner -->
      <div class="temple-banner">
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
          <img src="temple.png" alt="Temple" style="width:48px;height:36px;object-fit:cover;border-radius:4px;border:2px solid var(--primary);" />
          <div>
            <div class="gujarati-text">🙏 શ્રી શંખેશ્વર પાર્શ્વનાથય નમઃ 🙏</div>
            <div class="sangh-name">S K Shah Gotri Sangh, Harinagar</div>
          </div>
          <img src="temple.png" alt="Temple" style="width:48px;height:36px;object-fit:cover;border-radius:4px;border:2px solid var(--primary);" />
        </div>
      </div>

      <!-- Top Bar -->
      <div class="topbar">
        <div class="topbar-left">
          <span class="app-title">🛕 Derasar Boli</span>
        </div>
        <div class="topbar-right">
          <span id="user-role-badge" class="role-badge"></span>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Nav Tabs -->
      <div class="nav-tabs" id="nav-tabs"></div>

      <!-- Page Content -->
      <div id="page-content" class="page-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/members.js"></script>
  <script src="js/events.js"></script>
  <script src="js/heads.js"></script>
  <script src="js/donations.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/reports-page.js"></script>
  <script src="js/users.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/derasar-boli/sw.js');
    }
  </script>
</body>
</html>
