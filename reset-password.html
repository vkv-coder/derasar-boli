<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Derasar Boli</title>
  <link rel="icon" href="temple.png" />
  <meta name="theme-color" content="#7B3F00" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div class="screen active" style="display:flex;">
      <div class="login-box">
        <div class="logo-area">
          <img src="temple.png" alt="Temple" style="width:100px;height:70px;object-fit:cover;border-radius:8px;margin-bottom:8px;" />
          <h1>Reset Password</h1>
          <p class="subtitle">Derasar Boli</p>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="new-password" placeholder="Enter new password (min 6 characters)" />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirm-password" placeholder="Re-enter new password" />
        </div>
        <button class="btn-primary" onclick="updatePassword()">Update Password</button>
        <div id="reset-msg" class="error-msg"></div>
        <div id="reset-success" style="display:none;text-align:center;margin-top:16px;">
          <p style="color:#4CAF50;font-weight:600;">✅ Password updated successfully!</p>
          <a href="index.html" style="color:var(--primary);font-weight:600;">Go to Login →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    let recoverySession = null;

    // Supabase sends the recovery token as a hash fragment (#access_token=...&type=recovery)
    // OR as a query param depending on flow. Handle both via onAuthStateChange.
    db.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        recoverySession = session;
      }
    });

    // Also try getSession in case it's already set
    window.addEventListener('load', async () => {
      const { data } = await db.auth.getSession();
      if (data.session) {
        recoverySession = data.session;
      }
    });

    async function updatePassword() {
      const pw1 = document.getElementById('new-password').value.trim();
      const pw2 = document.getElementById('confirm-password').value.trim();
      const msgEl = document.getElementById('reset-msg');
      msgEl.textContent = '';

      if (!pw1 || !pw2) {
        msgEl.textContent = 'Please fill both fields.';
        return;
      }
      if (pw1.length < 6) {
        msgEl.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (pw1 !== pw2) {
        msgEl.textContent = 'Passwords do not match.';
        return;
      }

      const { error } = await db.auth.updateUser({ password: pw1 });

      if (error) {
        msgEl.textContent = 'Error: ' + error.message;
        return;
      }

      document.querySelector('.login-box').querySelectorAll('.form-group, button.btn-primary').forEach(el => el.style.display = 'none');
      document.getElementById('reset-success').style.display = 'block';
    }
  </script>
</body>
</html>
