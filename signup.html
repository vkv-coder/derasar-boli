<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sangh Registration - Derasar Boli</title>
  <link rel="icon" href="temple.png" />
  <meta name="theme-color" content="#7B3F00" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div class="screen active" style="display:flex;">
      <div class="login-box">
        <div class="logo-area">
          <img src="temple.png" alt="Temple" style="width:100px;height:70px;object-fit:cover;border-radius:8px;margin-bottom:8px;" />
          <h1>New Sangh Registration</h1>
          <p class="subtitle">Derasar Boli</p>
        </div>

        <div class="form-group">
          <label>Sangh Name</label>
          <input type="text" id="signup-sangh-name" placeholder="e.g. Example Jain Sangh, City" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="Enter email" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="signup-phone" placeholder="10-digit mobile number" maxlength="10" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="Min 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm-password" placeholder="Re-enter password" />
        </div>

        <button class="btn-primary" id="signup-btn" onclick="submitSignup()">Submit Registration</button>
        <div id="signup-msg" class="error-msg"></div>

        <div id="signup-success" style="display:none;text-align:center;margin-top:16px;">
          <p style="color:#4CAF50;font-weight:600;">✅ Registration submitted!</p>
          <p style="font-size:13px;color:var(--text-muted);margin-top:6px;">Your Sangh will be verified and approved shortly. You'll be able to log in once approved.</p>
          <a href="index.html" style="color:var(--primary);font-weight:600;display:inline-block;margin-top:10px;">Go to Login →</a>
        </div>

        <div style="text-align:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);">
          For support / verification contact:<br/>
          📧 vkvcoder.support@gmail.com<br/>
          📞 9327243611
        </div>

        <div style="text-align:center;margin-top:12px;">
          <a href="index.html" style="color:var(--primary);font-weight:600;font-size:13px;">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
